name: Final Submission Package

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/final-package.yml"

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create clean source archive
        run: |
          set -euo pipefail
          zip -r loopos-autonomous-company-simulator-final.zip . \
            -x '.git/*' \
               'node_modules/*' \
               '.next/*' \
               '.env' \
               '.env.*' \
               '*.db' \
               '*.sqlite' \
               '*.sqlite3' \
               '.DS_Store' \
               '__pycache__/*' \
               '*.pyc'
          sha256sum loopos-autonomous-company-simulator-final.zip > loopos-autonomous-company-simulator-final.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: loopos-final-submission
          path: |
            loopos-autonomous-company-simulator-final.zip
            loopos-autonomous-company-simulator-final.zip.sha256
          if-no-files-found: error
          retention-days: 30
