name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node scripts/evaluate.mjs
      - run: npm run build
      - name: Verify live production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LIVE_BASE_URL: https://loopos-autonomous-company-simulator-nathmagency-2935s-projects.vercel.app
        run: node scripts/live-verify.mjs
