name: Neon Function Smoke

on:
  push:
    branches: ["fix/neon-function-backend"]
    paths:
      - ".github/workflows/neon-probe.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe Neon Function
        run: |
          set -euo pipefail
          url='https://br-lucky-haze-b5pb8wxa-looposprobe.compute.c-7.us-east-2.aws.neon.tech/'
          body="$(curl --fail-with-body --silent --show-error "$url")"
          echo "$body"
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.ok || !x.has_db) process.exit(1)' "$body"
